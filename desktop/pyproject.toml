[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pendulum-workbench"
version = "0.1.0"
description = "Desktop workbench for pendulum experiments"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7", "pyserial>=3.5"]

[project.scripts]
pendulum-workbench = "pendulum_workbench.app:main"

[tool.setuptools.packages.find]
where = ["src"]
